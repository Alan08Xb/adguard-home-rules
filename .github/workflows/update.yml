name: 自动更新规则

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 下载并合并规则
        run: |
          > temp_rules.txt
          rule_sources=0
          valid_sources=0
          total_raw=0
          
          echo "开始下载规则源"
          
          while IFS= read -r url; do
            if echo "$url" | grep -qv '^#' && [ -n "$url" ]; then
              url=$(echo "$url" | tr -d '[:space:]')
              rule_sources=$((rule_sources + 1))
              echo "[$rule_sources] $url"
              
              if curl -sS --retry 3 --connect-timeout 30 "$url" -o temp_download.txt 2>/dev/null; then
                first_line=$(head -1 temp_download.txt)
                if echo "$first_line" | grep -qiE '<!doctype|<html|<head|<body|<title|<meta'; then
                  echo "   跳过(HTML)"
                  rm -f temp_download.txt
                  continue
                fi
                download_count=$(wc -l < temp_download.txt)
                total_raw=$((total_raw + download_count))
                valid_sources=$((valid_sources + 1))
                echo "   OK: $download_count 行"
                cat temp_download.txt >> temp_rules.txt
              else
                echo "   失败"
              fi
              rm -f temp_download.txt
            fi
          done < sources.txt
          
          echo ""
          echo "有效源: $valid_sources / $rule_sources"
          total_before=$(wc -l < temp_rules.txt)
          echo "下载: $total_before 行"
          
          grep -v '^[!！#\[]' temp_rules.txt | \
          grep -v '^$' | \
          grep -vE '<[a-zA-Z/]' | \
          grep -vE '[{}]' | \
          grep -vE '^[[:space:]]*[.#]' | \
          grep -vE '^@[^@]' | \
          grep -vE 'font-|margin|padding|color|background|display|text-' | \
          grep -vE '##|#@#' | \
          grep -vE 'override-property-read|script:inject|script:contains|:style|:xpath' | \
          grep -vE '^\[|^\^|^\?|^&' | \
          grep -vE '^(&|\.|\-|\/)' | \
          grep -vE '^\|\|.*\$[a-z]' | \
          sed 's/[[:space:]]*$//' | \
          sort -u > merged-rules.txt
          
          final_count=$(wc -l < merged-rules.txt)
          echo "去重后: $final_count 条"
          
          UPDATE_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          
          grep -E '^@@' merged-rules.txt | sort -u > rules_wl.txt
          whitelist_count=$(wc -l < rules_wl.txt)
          grep '^||' merged-rules.txt | grep -v '^@@' | sort -u > rules_dm.txt
          domain_count=$(wc -l < rules_dm.txt)
          grep -E '^(0\.0\.0\.0|127\.0\.0\.1)[[:space:]]' merged-rules.txt | sort -u > rules_hs.txt
          hosts_count=$(wc -l < rules_hs.txt)
          grep '^/' merged-rules.txt | sort -u > rules_rx.txt
          regex_count=$(wc -l < rules_rx.txt)
          grep -v '^@@' merged-rules.txt | grep -v '^||' | grep -v '^/' | grep -vE '^(0\.0\.0\.0|127\.0\.0\.1)' | sort -u > rules_pl.txt
          plain_count=$(wc -l < rules_pl.txt)
          
          echo "! ==========================================" > rules.txt
          echo "! 聚合广告过滤规则 (DNS可用)" >> rules.txt
          echo "! 更新时间: $UPDATE_TIME (北京时间)" >> rules.txt
          echo "! 规则源: $valid_sources 个" >> rules.txt
          echo "! 去重后: $final_count 条" >> rules.txt
          echo "! ==========================================" >> rules.txt
          echo "" >> rules.txt
          
          echo "! --- 白名单 $whitelist_count 条 ---" >> rules.txt
          cat rules_wl.txt >> rules.txt
          echo "" >> rules.txt
          echo "! --- 域名屏蔽 $domain_count 条 ---" >> rules.txt
          cat rules_dm.txt >> rules.txt
          
          if [ "$hosts_count" -gt 0 ]; then
            echo "" >> rules.txt
            echo "! --- Hosts格式 $hosts_count 条 ---" >> rules.txt
            cat rules_hs.txt >> rules.txt
          fi
          
          echo "" >> rules.txt
          echo "! --- 正则 $regex_count 条 ---" >> rules.txt
          cat rules_rx.txt >> rules.txt
          
          if [ "$plain_count" -gt 0 ]; then
            echo "" >> rules.txt
            echo "! --- 纯域名 $plain_count 条 ---" >> rules.txt
            cat rules_pl.txt >> rules.txt
          fi
          
          rm -f merged-rules.txt temp_rules.txt rules_*.txt
          
          echo ""
          echo "白名单:$whitelist_count 域名:$domain_count Hosts:$hosts_count 正则:$regex_count 纯域名:$plain_count"

      - name: 保存并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "更新规则 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push
