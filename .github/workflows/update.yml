name: 自动更新规则

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 下载并合并规则
        run: |
          # 初始化
          > temp_rules.txt
          rule_sources=0
          total_raw=0
          
          echo "========================================"
          echo "  开始下载规则源"
          echo "========================================"
          
          # 从 sources.txt 读取规则源
          while IFS= read -r url; do
            # 跳过注释行和空行
            if [[ ! "$url" =~ ^[[:space:]]*# ]] && [[ -n "$url" ]]; then
              rule_sources=$((rule_sources + 1))
              echo ""
              echo "📥 [$rule_sources] 下载: $url"
              
              # 下载规则
              if curl -sS --retry 3 --connect-timeout 30 "$url" -o temp_download.txt; then
                download_count=$(wc -l < temp_download.txt)
                total_raw=$((total_raw + download_count))
                echo "   ✅ 成功: $download_count 条"
                
                # 追加到临时文件
                cat temp_download.txt >> temp_rules.txt
              else
                echo "   ❌ 下载失败，跳过此源"
              fi
              rm -f temp_download.txt
            fi
          done < sources.txt
          
          echo ""
          echo "========================================"
          echo "  处理规则"
          echo "========================================"
          
          # 原始总数（包含注释空行）
          total_with_comments=$(wc -l < temp_rules.txt)
          echo "📊 下载总量(含注释): $total_with_comments"
          
          # 去注释、去空行、去重
          grep -v '^[!！#\[]' temp_rules.txt | \
          grep -v '^$' | \
          grep -v '^/' | \
          sed 's/[[:space:]]*$//' | \
          sort -u > merged-rules.txt
          
          # 统计数据
          final_count=$(wc -l < merged-rules.txt)
          removed=$((total_with_comments - final_count))
          
          echo "📊 有效规则提取: $total_with_comments"
          echo "🗑️  去除无效/重复: $removed"
          echo "✅ 最终规则总数: $final_count"
          
          echo ""
          echo "========================================"
          echo "  生成规则文件"
          echo "========================================"
          
          # 生成带详细信息的头部
          {
            echo "! =========================================="
            echo "! Title: 聚合广告过滤规则"
            echo "! =========================================="
            echo "! 更新时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') (北京时间)"
            echo "! 规则来源数: $rule_sources 个"
            echo "! 下载总量: $total_with_comments 条 (含注释空行)"
            echo "! 有效规则: $total_with_comments 条"
            echo "! 去重后总数: $final_count 条"
            echo "! 去除无效/重复: $removed 条"
            echo "! =========================================="
            echo "!"
            echo "! 规则来源列表:"
            
            # 列出规则源
            while IFS= read -r url; do
              if [[ ! "$url" =~ ^[[:space:]]*# ]] && [[ -n "$url" ]]; then
                echo "!   - $url"
              fi
            done < sources.txt
            
            echo "! =========================================="
            echo ""
          } > rules.txt
          
          # 追加去重后的规则
          cat merged-rules.txt >> rules.txt
          
          # 清理
          rm -f temp_rules.txt merged-rules.txt
          
          echo ""
          echo "🎉 规则更新完成！"

      - name: 保存并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "🔄 更新规则 - $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push
