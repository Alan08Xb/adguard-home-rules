name: 自动更新规则

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

# 需要写权限才能推送更新
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 下载并合并规则
        run: |
          > temp_rules.txt
          
          echo "📥 正在下载规则..."
          curl -s "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt" >> temp_rules.txt
          curl -s "https://anti-ad.net/easylist.txt" >> temp_rules.txt
          curl -s "https://raw.githubusercontent.com/AdguardTeam/AdguardFilters/master/ChineseFilter/sections/adservers.txt" >> temp_rules.txt
          
          raw_count=$(wc -l < temp_rules.txt)
          echo "📊 原始规则数: $raw_count"
          
          grep -v '^[!！#]' temp_rules.txt | grep -v '^$' | sed 's/[[:space:]]*$//' | sort -u > merged-rules.txt
          
          final_count=$(wc -l < merged-rules.txt)
          echo "✅ 去重后规则: $final_count"
          echo "🗑️  移除重复: $((raw_count - final_count))"
          
          echo "! Title: 聚合广告过滤规则" > rules.txt
          echo "! 更新时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" >> rules.txt
          echo "! 规则总数: $final_count" >> rules.txt
          echo "" >> rules.txt
          cat merged-rules.txt >> rules.txt
          
          rm temp_rules.txt merged-rules.txt

      - name: 保存更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "🔄 更新规则 $(TZ='Asia/Shanghai' date '+%Y-%m-%d')"
          git push
