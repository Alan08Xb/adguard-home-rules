name: 更新三档规则

on:
  schedule:
    - cron: '0 22 * * *'   # 每天 06:00 北京时间
    - cron: '0 10 * * *'   # 每天 18:00 北京时间
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 构建三档规则
        run: python3 build.py

      - name: 移除旧的单档规则文件
        run: rm -f rules.txt

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "更新三档规则 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
            git push
          fi
